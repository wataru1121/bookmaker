    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中綴じ面付けツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { font-size: 22px; text-align: center; color: #007bff; margin-bottom: 10px; }

        .setup-area {
            border: 2px dashed #cbd5e0; background: #f8fafc; padding: 30px;
            text-align: center; border-radius: 8px; margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .setup-area.dragover { border-color: #007bff; background: #e0f0ff; }

        .upload-btn { background: #007bff; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; }
        .upload-btn:hover { background: #0056b3; }

        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        #generateBtn { background: #28a745; color: white; }
        #generateBtn:disabled { background: #cbd5e0; cursor: not-allowed; }
        #downloadBtn { background: #17a2b8; color: white; display: none; }

        /* Log panel */
        .log-panel {
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px;
            padding: 12px 16px; margin-bottom: 16px; font-size: 12px;
            font-family: monospace; line-height: 1.8; color: #444;
            max-height: 160px; overflow-y: auto; display: none;
        }
        .log-panel.visible { display: block; }
        .log-line { display: flex; gap: 8px; }
        .log-line .tag { flex-shrink: 0; }
        .log-line.ok .tag { color: #28a745; }
        .log-line.warn .tag { color: #e6a817; }
        .log-line.err .tag { color: #dc3545; }

        /* Progress bar */
        .progress-bar-wrap {
            width: 100%; height: 4px; background: #e2e8f0;
            border-radius: 4px; overflow: hidden; margin-bottom: 16px; display: none;
        }
        .progress-bar-wrap.visible { display: block; }
        .progress-bar {
            height: 100%; background: linear-gradient(90deg, #007bff, #28a745);
            width: 0%; transition: width 0.3s ease;
        }

        /* トグルスイッチ */
        .switch-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
        .switch-row label.sw-label { font-weight: bold; color: #333; cursor: pointer; user-select: none; }
        .switch-row .desc { color: #666; font-size: 12px; }
        .toggle { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #cbd5e0; border-radius: 26px; cursor: pointer; transition: 0.3s; }
        .slider:before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        input:checked + .slider { background: #007bff; }
        input:checked + .slider:before { transform: translateX(20px); }

        .exclude-row { flex-direction: column; align-items: stretch; }
        .exclude-row .exclude-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
        .exclude-row .exclude-input-line { display: flex; gap: 8px; }
        #excludeInput { flex: 1; padding: 9px 10px; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 14px; font-family: inherit; }
        #excludeInput:focus { outline: none; border-color: #007bff; }
        #excludePreviewBtn { flex: none; width: auto; padding: 9px 18px; font-size: 14px; background: #6c757d; color: #fff; }
        #excludePreviewBtn:hover { background: #565e64; }
        #excludePreviewContainer { display: none; margin-top: 12px; }
        .exclude-preview-empty { font-size: 13px; color: #888; padding: 8px 2px; }
        .exclude-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
        .exclude-preview-item { position: relative; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; background: #fff; }
        .exclude-preview-item canvas { width: 100%; display: block; }
        .exclude-preview-item .ep-label { position: absolute; top: 4px; left: 4px; background: rgba(220,53,69,0.9); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .exclude-preview-item .ep-fname { font-size: 10px; color: #666; padding: 4px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #excludeBrowseBtn { flex: none; width: auto; padding: 9px 18px; font-size: 14px; background: #495057; color: #fff; }
        #excludeBrowseBtn:hover { background: #343a40; }
        #excludeBrowseContainer { display: none; margin-top: 14px; }
        .exclude-browse-scroll {
            display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
            padding: 4px 2px 12px; -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity;
        }
        .exclude-browse-item {
            position: relative; flex: 0 0 auto; width: 108px;
            border: 2px solid #e2e8f0; border-radius: 6px; overflow: hidden;
            background: #fff; scroll-snap-align: start; transition: border-color 0.15s;
        }
        .exclude-browse-item.checked { border-color: #dc3545; }
        .exclude-browse-thumb {
            width: 108px; height: 148px; background: #eef1f4;
            display: flex; align-items: center; justify-content: center;
            color: #aaa; font-size: 11px;
        }
        .exclude-browse-thumb canvas { max-width: 100%; max-height: 100%; display: block; }
        .exclude-browse-check {
            position: absolute; top: 6px; left: 6px; width: 20px; height: 20px;
            z-index: 2; cursor: pointer; accent-color: #dc3545;
        }
        .exclude-browse-num {
            position: absolute; bottom: 26px; right: 4px; background: rgba(0,0,0,0.6);
            color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 4px;
        }
        .exclude-browse-fname { font-size: 10px; color: #666; padding: 3px 5px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #previewContainer { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        #previewContainer h3 { font-size: 16px; margin-bottom: 6px; }
        #pdfIframe { width: 100%; height: 500px; border: 1px solid #ccc; border-radius: 4px; display: block; }
        #canvasContainer canvas { width: 100%; border: 1px solid #ccc; border-radius: 4px; display: block; margin-bottom: 8px; }
        #previewNav { display: none; align-items: center; justify-content: center; gap: 12px; margin: 8px 0; font-size: 14px; }
        #previewNav button { flex: none; padding: 6px 16px; font-size: 14px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #previewNav button:disabled { background: #cbd5e0; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <h1>中綴じ面付けツール</h1>
    <h1>「短辺とじ両面印刷」で完成</h1>

    <div class="setup-area" id="dropZone">
        <p>PDFまたは画像をドラッグ＆ドロップしてください</p>
        <p>または</p>
        <label class="upload-btn">
            ファイルを選択
            <input type="file" id="fileInput" multiple="" accept="application/pdf,image/jpeg,image/png" style="display:none">
        </label>
        <div id="fileInfo" style="margin-top:15px; font-size:14px; color:#444; font-weight:bold;"></div>
    </div>

    <div class="switch-row">
        <label class="toggle">
            <input type="checkbox" id="splitToggle">
            <span class="slider"></span>
        </label>
        <div>
            <label class="sw-label" for="splitToggle">見開き分割モード</label>
            <div class="desc">横長（見開き）PDFを左右に分割してから面付けします</div>
        </div>
    </div>

    <div class="switch-row exclude-row">
        <div class="exclude-head">
            <label class="sw-label" for="excludeInput">除外するページ：</label>
            <div class="desc">元データの通しページ番号をカンマ区切りで指定（例: 3, 7, 12-14）。冊子から除外されます。</div>
        </div>
        <div class="exclude-input-line">
            <input type="text" id="excludeInput" placeholder="例: 3, 7, 12-14">
            <button id="excludePreviewBtn" type="button">参照</button>
            <button id="excludeBrowseBtn" type="button">全ページから選ぶ</button>
        </div>
        <div id="excludePreviewContainer"></div>
        <div id="excludeBrowseContainer"></div>
    </div>

    <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="log-panel" id="logPanel"></div>

    <div class="actions">
        <button id="generateBtn" disabled="">プレビューを生成する</button>
        <button id="downloadBtn">PDFをダウンロード</button>
    </div>

    <div id="previewContainer">
        <h3>生成プレビュー</h3>
        <p style="font-size:12px; color:#666;">問題なければ上のダウンロードボタンを押してください。</p>
        <iframe id="pdfIframe" style="display:none"></iframe>
        <div id="previewNav">
            <button id="prevPageBtn" disabled="">◀</button>
            <span id="pageLabel">-</span>
            <button id="nextPageBtn" disabled="">▶</button>
        </div>
        <div id="canvasContainer"></div>
    </div>
</div>

<script>
    const { PDFDocument, degrees } = PDFLib;
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput      = document.getElementById('fileInput');
    const dropZone       = document.getElementById('dropZone');
    const generateBtn    = document.getElementById('generateBtn');
    const downloadBtn    = document.getElementById('downloadBtn');
    const fileInfo       = document.getElementById('fileInfo');
    const logPanel       = document.getElementById('logPanel');
    const progressWrap   = document.getElementById('progressWrap');
    const progressBar    = document.getElementById('progressBar');
    const previewContainer = document.getElementById('previewContainer');
    const pdfIframe      = document.getElementById('pdfIframe');
    const canvasContainer= document.getElementById('canvasContainer');
    const previewNav     = document.getElementById('previewNav');
    const pageLabel      = document.getElementById('pageLabel');
    const prevPageBtn    = document.getElementById('prevPageBtn');
    const nextPageBtn    = document.getElementById('nextPageBtn');
    const splitToggle    = document.getElementById('splitToggle');
    const excludeInput   = document.getElementById('excludeInput');
    const excludePreviewBtn = document.getElementById('excludePreviewBtn');
    const excludePreviewContainer = document.getElementById('excludePreviewContainer');
    const excludeBrowseBtn = document.getElementById('excludeBrowseBtn');
    const excludeBrowseContainer = document.getElementById('excludeBrowseContainer');

    let currentFiles = [];
    let generatedPdfBlob = null;
    let previewPdfDoc = null;
    let currentPreviewPage = 1;

    // 「全ページから選ぶ」パネル用の状態（ファイル選択が変わらない限りキャッシュを使い回す）
    let browseOpen = false;
    let browseFilesSignature = null;
    let browsePdfDocs = [];           // fileIndex -> pdf.js document（ページ数取得・遅延レンダリング用）
    let browsePageMeta = [];          // [{globalPage, kind, fileIndex, localPage, fileName, file}]
    let browsePageMetaMap = new Map();// globalPage -> meta（高速参照用）
    let browseThumbCache = new Map(); // globalPage -> 描画済みcanvas（再スクロール・再オープンで再利用）
    let browseObserver = null;

    function resetBrowseState() {
        if (browseObserver) { browseObserver.disconnect(); browseObserver = null; }
        browseOpen = false;
        browseFilesSignature = null;
        browsePdfDocs = [];
        browsePageMeta = [];
        browsePageMetaMap = new Map();
        browseThumbCache.clear();
        excludeBrowseContainer.style.display = 'none';
        excludeBrowseContainer.innerHTML = '';
        excludeBrowseBtn.textContent = '全ページから選ぶ';
    }

    // ---- Drag & Drop ----
    ['dragenter','dragover','dragleave','drop'].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
    dropZone.addEventListener('dragover',  () => dropZone.classList.add('dragover'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => { dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    function handleFiles(files) {
        if (!files.length) return;
        currentFiles = Array.from(files);
        generateBtn.disabled = false;
        fileInfo.textContent = `✅ ${currentFiles.length} 個のファイルが選択されました`;
        clearLog();
        excludePreviewContainer.style.display = 'none';
        excludePreviewContainer.innerHTML = '';
        resetBrowseState();
    }

    // ---- 除外ページ指定のパース ----
    // "3, 7, 12-14" のようなカンマ/スペース区切り（範囲指定も可）を数値集合に変換
    function parseExcludePages(str) {
        const set = new Set();
        if (!str) return set;
        const parts = str.split(/[,、\s]+/).filter(Boolean);
        for (const part of parts) {
            const rangeMatch = part.match(/^(\d+)\s*-\s*(\d+)$/);
            if (rangeMatch) {
                let a = parseInt(rangeMatch[1], 10), b = parseInt(rangeMatch[2], 10);
                if (a > b) [a, b] = [b, a];
                for (let n = a; n <= b; n++) set.add(n);
            } else {
                const n = parseInt(part, 10);
                if (!isNaN(n) && n > 0) set.add(n);
            }
        }
        return set;
    }

    // ---- 画像ファイルをサムネイルcanvasに変換 ----
    async function imageFileToThumbCanvas(bytes, mime, maxDim = 300) {
        const blob = new Blob([bytes], { type: mime });
        const bitmap = await createImageBitmap(blob);
        const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        return canvas;
    }

    // ---- 指定された通しページ番号に該当するページのサムネイルを生成 ----
    // ページ番号は「ソート済みファイルを結合した際の元データの通しページ番号」
    async function renderExcludePreviews(files, excludeSet) {
        const sorted = [...files].sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true }));
        const results = [];
        let globalCounter = 0;

        for (const file of sorted) {
            const bytes = await file.arrayBuffer();
            if (file.type === 'application/pdf') {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                    globalCounter++;
                    if (!excludeSet.has(globalCounter)) continue;
                    const page = await pdf.getPage(i);
                    const vp0 = page.getViewport({ scale: 1 });
                    const scale = Math.min(1.0, 300 / Math.max(vp0.width, vp0.height));
                    const viewport = page.getViewport({ scale });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    results.push({ globalPage: globalCounter, fileName: file.name, canvas });
                }
            } else {
                globalCounter++;
                if (!excludeSet.has(globalCounter)) continue;
                const canvas = await imageFileToThumbCanvas(bytes, file.type);
                results.push({ globalPage: globalCounter, fileName: file.name, canvas });
            }
        }
        results.sort((a, b) => a.globalPage - b.globalPage);
        return { results, totalPages: globalCounter };
    }

    // ---- 「参照」ボタン：指定ページの実物を表示して確認 ----
    excludePreviewBtn.addEventListener('click', async () => {
        if (!currentFiles.length) { alert('先にファイルを選択してください。'); return; }
        const excludeSet = parseExcludePages(excludeInput.value);
        excludePreviewContainer.style.display = 'block';

        if (excludeSet.size === 0) {
            excludePreviewContainer.innerHTML = '<div class="exclude-preview-empty">除外ページが指定されていません。</div>';
            return;
        }

        excludePreviewContainer.innerHTML = '<div class="exclude-preview-empty">読み込み中...</div>';
        excludePreviewBtn.disabled = true;
        try {
            const { results, totalPages } = await renderExcludePreviews(currentFiles, excludeSet);
            excludePreviewContainer.innerHTML = '';

            const outOfRange = [...excludeSet].filter(n => n > totalPages).sort((a, b) => a - b);
            if (outOfRange.length) {
                const warn = document.createElement('div');
                warn.className = 'exclude-preview-empty';
                warn.style.color = '#dc3545';
                warn.textContent = `⚠ ページ番号 ${outOfRange.join(', ')} は元データの合計ページ数（${totalPages}）を超えているため無視されます。`;
                excludePreviewContainer.appendChild(warn);
            }

            if (results.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'exclude-preview-empty';
                empty.textContent = '該当するページが見つかりませんでした。';
                excludePreviewContainer.appendChild(empty);
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'exclude-preview-grid';
            for (const item of results) {
                const div = document.createElement('div');
                div.className = 'exclude-preview-item';
                div.appendChild(item.canvas);
                const label = document.createElement('div');
                label.className = 'ep-label';
                label.textContent = `${item.globalPage}ページ目`;
                div.appendChild(label);
                const fname = document.createElement('div');
                fname.className = 'ep-fname';
                fname.textContent = item.fileName;
                div.appendChild(fname);
                grid.appendChild(div);
            }
            excludePreviewContainer.appendChild(grid);
        } catch (e) {
            excludePreviewContainer.innerHTML = `<div class="exclude-preview-empty" style="color:#dc3545;">プレビュー生成中にエラーが発生しました: ${e.message}</div>`;
        } finally {
            excludePreviewBtn.disabled = false;
        }
    });

    // ---- 除外集合を整形して excludeInput に書き戻す（連続番号は範囲表記にまとめる） ----
    function formatExcludeSet(set) {
        const nums = [...set].sort((a, b) => a - b);
        if (nums.length === 0) return '';
        const parts = [];
        let start = nums[0], prev = nums[0];
        for (let i = 1; i <= nums.length; i++) {
            const n = nums[i];
            if (n === prev + 1) { prev = n; continue; }
            parts.push(start === prev ? `${start}` : `${start}-${prev}`);
            if (i < nums.length) { start = prev = n; }
        }
        return parts.join(', ');
    }

    function toggleExcludePage(num, checked) {
        const set = parseExcludePages(excludeInput.value);
        if (checked) set.add(num); else set.delete(num);
        excludeInput.value = formatExcludeSet(set);
    }

    // excludeInput を手で編集した場合も、開いているパネルのチェック状態に反映する
    excludeInput.addEventListener('input', () => {
        if (!browseOpen) return;
        const set = parseExcludePages(excludeInput.value);
        excludeBrowseContainer.querySelectorAll('.exclude-browse-item').forEach(item => {
            const gp = parseInt(item.dataset.globalPage, 10);
            const isChecked = set.has(gp);
            item.classList.toggle('checked', isChecked);
            const cb = item.querySelector('.exclude-browse-check');
            if (cb) cb.checked = isChecked;
        });
    });

    // ---- 全ページ分のメタ情報（ページ数・ファイル対応）を構築。まだ描画はしない ----
    async function buildBrowseMeta(files) {
        const sorted = [...files].sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true }));
        browsePdfDocs = [];
        browsePageMeta = [];
        browsePageMetaMap = new Map();
        let globalCounter = 0;

        for (let fi = 0; fi < sorted.length; fi++) {
            const file = sorted[fi];
            if (file.type === 'application/pdf') {
                const bytes = await file.arrayBuffer();
                const doc = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
                browsePdfDocs[fi] = doc;
                for (let i = 1; i <= doc.numPages; i++) {
                    globalCounter++;
                    const meta = { globalPage: globalCounter, kind: 'pdf', fileIndex: fi, localPage: i, fileName: file.name };
                    browsePageMeta.push(meta);
                    browsePageMetaMap.set(globalCounter, meta);
                }
            } else {
                globalCounter++;
                const meta = { globalPage: globalCounter, kind: 'image', fileIndex: fi, fileName: file.name, file };
                browsePageMeta.push(meta);
                browsePageMetaMap.set(globalCounter, meta);
            }
        }
    }

    // ---- 1ページ分のサムネイルを描画（小さめの解像度・結果はキャッシュ） ----
    async function renderBrowseThumb(meta) {
        if (browseThumbCache.has(meta.globalPage)) return browseThumbCache.get(meta.globalPage);
        const targetW = 160; // 軽さ優先で小さめの解像度にする
        let canvas;
        if (meta.kind === 'pdf') {
            const doc = browsePdfDocs[meta.fileIndex];
            const page = await doc.getPage(meta.localPage);
            const vp0 = page.getViewport({ scale: 1 });
            const scale = targetW / vp0.width;
            const viewport = page.getViewport({ scale });
            canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        } else {
            const bytes = await meta.file.arrayBuffer();
            canvas = await imageFileToThumbCanvas(bytes, meta.file.type, targetW);
        }
        browseThumbCache.set(meta.globalPage, canvas);
        return canvas;
    }

    async function renderIntoThumb(itemEl, globalPage) {
        const meta = browsePageMetaMap.get(globalPage);
        if (!meta) return;
        const wrap = itemEl.querySelector('.exclude-browse-thumb');
        try {
            const canvas = await renderBrowseThumb(meta);
            wrap.innerHTML = '';
            wrap.appendChild(canvas);
        } catch (e) {
            wrap.textContent = '×';
        }
    }

    function buildBrowseItemElement(meta, checkedSet) {
        const item = document.createElement('div');
        item.className = 'exclude-browse-item' + (checkedSet.has(meta.globalPage) ? ' checked' : '');
        item.dataset.globalPage = String(meta.globalPage);

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'exclude-browse-thumb';
        thumbWrap.textContent = '…';
        item.appendChild(thumbWrap);

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'exclude-browse-check';
        check.checked = checkedSet.has(meta.globalPage);
        check.addEventListener('change', () => {
            item.classList.toggle('checked', check.checked);
            toggleExcludePage(meta.globalPage, check.checked);
        });
        item.appendChild(check);

        const num = document.createElement('div');
        num.className = 'exclude-browse-num';
        num.textContent = `${meta.globalPage}`;
        item.appendChild(num);

        const fname = document.createElement('div');
        fname.className = 'exclude-browse-fname';
        fname.textContent = meta.fileName;
        item.appendChild(fname);

        return item;
    }

    // ---- 「全ページから選ぶ」ボタン：横スクロールの全ページ一覧を開閉 ----
    excludeBrowseBtn.addEventListener('click', async () => {
        if (!currentFiles.length) { alert('先にファイルを選択してください。'); return; }

        if (browseOpen) {
            resetBrowseState();
            return;
        }

        browseOpen = true;
        excludeBrowseBtn.textContent = '閉じる';
        excludeBrowseContainer.style.display = 'block';
        excludeBrowseContainer.innerHTML = '<div class="exclude-preview-empty">ページ情報を読み込み中...</div>';
        excludeBrowseBtn.disabled = true;

        try {
            // ファイルの選択内容が変わっていたらキャッシュを作り直す
            const sig = currentFiles.map(f => `${f.name}:${f.size}:${f.lastModified}`).join('|');
            if (sig !== browseFilesSignature) {
                browseThumbCache.clear();
                browsePdfDocs = [];
                browsePageMeta = [];
                browsePageMetaMap = new Map();
                browseFilesSignature = sig;
            }
            if (browsePageMeta.length === 0) {
                await buildBrowseMeta(currentFiles);
            }

            excludeBrowseContainer.innerHTML = '';
            const scroll = document.createElement('div');
            scroll.className = 'exclude-browse-scroll';
            excludeBrowseContainer.appendChild(scroll);

            const checkedSet = parseExcludePages(excludeInput.value);

            // 画面外（横方向）のページはまだ描画せず、スクロールで近づいたときだけレンダリングする
            const observer = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (!entry.isIntersecting) continue;
                    const el = entry.target;
                    observer.unobserve(el);
                    renderIntoThumb(el, parseInt(el.dataset.globalPage, 10));
                }
            }, { root: scroll, rootMargin: '300px', threshold: 0.01 });
            browseObserver = observer;

            for (const meta of browsePageMeta) {
                const item = buildBrowseItemElement(meta, checkedSet);
                scroll.appendChild(item);
                observer.observe(item);
            }
        } catch (e) {
            excludeBrowseContainer.innerHTML = `<div class="exclude-preview-empty" style="color:#dc3545;">読み込み中にエラーが発生しました: ${e.message}</div>`;
        } finally {
            excludeBrowseBtn.disabled = false;
        }
    });

    // ---- Logging ----
    function clearLog() { logPanel.innerHTML = ''; logPanel.classList.remove('visible'); }
    function log(msg, type = 'info') {
        logPanel.classList.add('visible');
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        const tags = { ok: '✓', warn: '⚠', err: '✗', info: '›' };
        line.innerHTML = `<span class="tag">${tags[type] || '›'}</span><span>${msg}</span>`;
        logPanel.appendChild(line);
        logPanel.scrollTop = logPanel.scrollHeight;
    }
    function setProgress(pct) {
        progressWrap.classList.add('visible');
        progressBar.style.width = pct + '%';
    }

    // ---- Preview (iframe → canvas fallback) ----
    const isAndroid = /Android/i.test(navigator.userAgent);

    async function renderCanvasPage(num) {
        canvasContainer.innerHTML = '';
        const page = await previewPdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');

    prevPageBtn.addEventListener('click', () => { if (currentPreviewPage > 1) renderCanvasPage(--currentPreviewPage); });
    nextPageBtn.addEventListener('click', () => { if (previewPdfDoc && currentPreviewPage < previewPdfDoc.numPages) renderCanvasPage(++currentPreviewPage); });

    async function showPreview(blobUrl, pdfBytes) {
        if (isAndroid) {
            // Android: blob URLをGoogleドライブビューアに渡しても開けないため
            // canvas (pdf.js) でレンダリング
            pdfIframe.style.display = 'none';
            previewNav.style.display = 'flex';

    // ---- Generate ----
    generateBtn.addEventListener('click', async () => {
        clearLog(); setProgress(0);
        generateBtn.disabled = true;
        downloadBtn.style.display = 'none';
        previewContainer.style.display = 'none';
        log('処理を開始します...');

        const excludeSet = parseExcludePages(excludeInput.value);
        if (excludeSet.size > 0) {
            log(`除外ページ指定: ${[...excludeSet].sort((a, b) => a - b).join(', ')}`);
        }

        try {
            let result = await createBooklet(currentFiles, excludeSet);

            if (result.streamError) {
                log('エラーが発生しました: ' + result.streamError, 'err');
                log('画像化モードで再処理します...', 'warn');
                setProgress(0);
                const rebuiltBytes = await rebuildAllFilesViaImages(currentFiles, excludeSet);
                log('画像化完了。面付けを開始します...', 'warn');
                const rebuiltBlob = new Blob([rebuiltBytes], { type: 'application/pdf' });
                const rebuiltFile = new File([rebuiltBlob], 'rebuilt.pdf', { type: 'application/pdf' });
                // 除外は画像化の時点で既に適用済みなので、ここでは再適用しない
                result = await createBooklet([rebuiltFile], new Set());
                if (result.streamError) throw new Error('画像化後も面付けに失敗しました: ' + result.streamError);
                result.isRebuilt = true;
            }

            generatedPdfBlob = new Blob([result.bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(generatedPdfBlob);
            previewContainer.style.display = 'block';
            downloadBtn.style.display = 'block';
            downloadBtn.textContent = '⬇ PDFをダウンロード';
            setProgress(100);
            showPreview(url, result.bytes);
            log(result.isRebuilt ? '画像化→面付けPDFの生成が完了しました！' : '面付けPDFの生成が完了しました！', 'ok');
        } catch (e) {
            log('エラーが発生しました: ' + e.message, 'err');
            console.error(e);
        } finally {
            generateBtn.disabled = false;
        }
    });

    downloadBtn.addEventListener('click', () => {
        if (!generatedPdfBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(generatedPdfBlob);
        a.download = `booklet_${Date.now()}.pdf`;
        a.click();
    });

    // ---- pdf-lib読み込み（スモークテスト付き） ----
    async function tryLoadWithPdfLib(bytes) {
        const doc = await PDFDocument.load(bytes, {
            ignoreBadStreams: true, throwOnInvalidObject: false, updateMetadata: false
        });
        doc.getPages().forEach(p => p.getSize());
        return doc;
    }

    // ---- pdf.jsでファイルを描画してA4縦正規化ページとしてintermediateDocに追加 ----
    async function renderAndAddPages(fileBytes, intermediateDoc, excludeSet = new Set(), startIndex = 0) {
        const a4w = 595.28, a4h = 841.89;
        const sourcePdf = await pdfjsLib.getDocument({ data: new Uint8Array(fileBytes) }).promise;
        let excludedCount = 0;
        for (let i = 1; i <= sourcePdf.numPages; i++) {
            const globalPage = startIndex + i;
            if (excludeSet.has(globalPage)) { excludedCount++; continue; }
            const page = await sourcePdf.getPage(i);
            // pdf.jsのviewportは回転込みの実効サイズを返す
            const vp0 = page.getViewport({ scale: 1 });
            const scale = Math.min(2.0, 1600 / Math.max(vp0.width, vp0.height));
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            const jpg = await intermediateDoc.embedJpg(canvas.toDataURL('image/jpeg', 0.90));
            const p = intermediateDoc.addPage([a4w, a4h]);
            const d = jpg.scaleToFit(a4w, a4h);
            p.drawImage(jpg, { x: (a4w - d.width)/2, y: (a4h - d.height)/2, width: d.width, height: d.height });
        }
        return { numPages: sourcePdf.numPages, excludedCount };
    }

    // ---- 見開きページをpdf.jsでcanvas描画→左右分割してintermediateDocに追加 ----
    async function splitAndAddSpreadPages(fileBytes, intermediateDoc, excludeSet = new Set(), startIndex = 0) {
        const a4w = 595.28, a4h = 841.89;
        const sourcePdf = await pdfjsLib.getDocument({ data: new Uint8Array(fileBytes) }).promise;
        let excludedCount = 0;

        for (let i = 1; i <= sourcePdf.numPages; i++) {
            const globalPage = startIndex + i;
            if (excludeSet.has(globalPage)) { excludedCount++; continue; }
            const page = await sourcePdf.getPage(i);
            const vp0 = page.getViewport({ scale: 1 });
            const isSpread = vp0.width > vp0.height * 1.2;
            const scale = Math.min(2.0, 2400 / Math.max(vp0.width, vp0.height));
            const viewport = page.getViewport({ scale });

            const canvas = document.createElement('canvas');
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

            if (isSpread) {
                const halfW = Math.floor(canvas.width / 2);
                for (const [sx, sw] of [[0, halfW], [halfW, canvas.width - halfW]]) {
                    const c = document.createElement('canvas');
                    c.width = sw; c.height = canvas.height;
                    c.getContext('2d').drawImage(canvas, sx, 0, sw, canvas.height, 0, 0, sw, canvas.height);
                    const jpg = await intermediateDoc.embedJpg(c.toDataURL('image/jpeg', 0.92));
                    const p = intermediateDoc.addPage([a4w, a4h]);
                    const d = jpg.scaleToFit(a4w, a4h);
                    p.drawImage(jpg, { x: (a4w - d.width)/2, y: (a4h - d.height)/2, width: d.width, height: d.height });
                }
            } else {
                const jpg = await intermediateDoc.embedJpg(canvas.toDataURL('image/jpeg', 0.92));
                const p = intermediateDoc.addPage([a4w, a4h]);
                const d = jpg.scaleToFit(a4w, a4h);
                p.drawImage(jpg, { x: (a4w - d.width)/2, y: (a4h - d.height)/2, width: d.width, height: d.height });
            }
        }
        return { numPages: sourcePdf.numPages, excludedCount };
    }

    // ---- メイン: 面付け処理（ストリームエラー時はstreamErrorを返す） ----
    async function createBooklet(files, excludeSet = new Set()) {
        const a4w = 595.28, a4h = 841.89;
        const doSplit = splitToggle.checked;

        const sorted = [...files].sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true }));

        const intermediateDoc = await PDFDocument.create();
        let filesDone = 0;
        let globalCounter = 0; // 元データの通しページ番号（除外ページ判定用）

        for (const file of sorted) {
            log(`読み込み中: ${file.name}`);
            const bytes = await file.arrayBuffer();

            if (file.type === 'application/pdf') {
                if (doSplit) {
                    // 見開き分割モード: pdf.jsでcanvas描画して分割
                    const r = await splitAndAddSpreadPages(bytes, intermediateDoc, excludeSet, globalCounter);
                    globalCounter += r.numPages;
                    log(r.excludedCount > 0
                        ? `追加（見開き分割、${r.excludedCount}ページ除外）: ${file.name}`
                        : `追加（見開き分割）: ${file.name}`, 'ok');
                } else {
                    try {
                        const r = await renderAndAddPages(bytes, intermediateDoc, excludeSet, globalCounter);
                        globalCounter += r.numPages;
                        log(r.excludedCount > 0
                            ? `追加（${r.excludedCount}ページ除外）: ${file.name}`
                            : `追加: ${file.name}`, 'ok');
                    } catch (renderErr) {
                        log(`スキップ: ${file.name} (${renderErr.message})`, 'err');
                        // ページ番号のズレを防ぐため、可能であれば総ページ数だけカウントを進める
                        try {
                            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
                            globalCounter += pdf.numPages;
                        } catch (_) { /* 取得できない場合は諦める */ }
                    }
                }
            } else {
                globalCounter++;
                if (excludeSet.has(globalCounter)) {
                    log(`除外: ${file.name}（${globalCounter}ページ目）`, 'warn');
                } else {
                    const img = file.type === 'image/jpeg'
                        ? await intermediateDoc.embedJpg(bytes)
                        : await intermediateDoc.embedPng(bytes);
                    const page = intermediateDoc.addPage([a4w, a4h]);
                    const dims = img.scaleToFit(a4w, a4h);
                    page.drawImage(img, { x: (a4w-dims.width)/2, y: (a4h-dims.height)/2, width: dims.width, height: dims.height });
                    log(`追加: ${file.name} (画像)`, 'ok');
                }
            }

            filesDone++;
            setProgress(Math.round((filesDone / sorted.length) * 40));
        }

        // 4の倍数に調整
        let totalPages = intermediateDoc.getPageCount();
        if (totalPages === 0) throw new Error('ページがありません（除外設定によりすべてのページが除外された可能性があります）。');
        while (totalPages % 4 !== 0) {
        addBlankPageWithContent(intermediateDoc, a4w, a4h);
        totalPages = intermediateDoc.getPageCount();
        }
        log(`合計 ${totalPages} ページ（空白ページ補完済）`, 'ok');
        setProgress(50);

        try {
            const intermediateBytes = await intermediateDoc.save({ useObjectStreams: false });
            const finalSourceDoc = await PDFDocument.load(intermediateBytes, { ignoreBadStreams: true });
            const srcPages = finalSourceDoc.getPages();

            log('面付け処理を開始...');
            const bookletDoc = await PDFDocument.create();
            const embeddedPages = [];
            for (const srcPage of srcPages) {
                const [emb] = await bookletDoc.embedPages([srcPage]);
                embeddedPages.push(emb);
            }
            setProgress(70);

            const sheetCount = totalPages / 4;
            for (let i = 0; i < sheetCount; i++) {
                const front = bookletDoc.addPage([a4w * 2, a4h]);
                front.drawPage(embeddedPages[totalPages - 1 - i * 2], { x: 0,   y: 0, width: a4w, height: a4h });
                front.drawPage(embeddedPages[0 + i * 2],              { x: a4w, y: 0, width: a4w, height: a4h });

                const back = bookletDoc.addPage([a4w * 2, a4h]);
                back.drawPage(embeddedPages[1 + i * 2],              { x: 0,   y: 0, width: a4w, height: a4h });
                back.drawPage(embeddedPages[totalPages - 2 - i * 2], { x: a4w, y: 0, width: a4w, height: a4h });

                setProgress(70 + Math.round(((i + 1) / sheetCount) * 28));
            }

            log('面付け完了 🎉', 'ok');
            return { bytes: await bookletDoc.save(), isRebuilt: false };

        } catch (impositionErr) {
            return { streamError: impositionErr.message };
        }
    }

    // ---- 全ファイルを画像化して1つのPDFに結合 ----
    async function rebuildAllFilesViaImages(files, excludeSet = new Set()) {
        const a4w = 595.28, a4h = 841.89;
        const sorted = [...files].sort((a, b) =>
            a.name.localeCompare(b.name, undefined, { numeric: true }));
        const newDoc = await PDFDocument.create();
        const allBytes = [];
        for (const file of sorted) allBytes.push(await file.arrayBuffer());

        let globalCounter = 0;
        for (let fi = 0; fi < sorted.length; fi++) {
            const file = sorted[fi];
            const bytes = allBytes[fi];
            if (file.type === 'application/pdf') {
                log(`画像化中: ${file.name}`);
                const sourcePdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes) }).promise;
                for (let i = 1; i <= sourcePdf.numPages; i++) {
                    globalCounter++;
                    if (excludeSet.has(globalCounter)) continue;
                    const page = await sourcePdf.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                    const jpg = await newDoc.embedJpg(canvas.toDataURL('image/jpeg', 0.85));
                    const p = newDoc.addPage([a4w, a4h]);
                    const d = jpg.scaleToFit(a4w, a4h);
                    p.drawImage(jpg, { x: (a4w-d.width)/2, y: (a4h-d.height)/2, width: d.width, height: d.height });
                }
                log(`画像化完了: ${file.name}`, 'ok');
            } else {
                globalCounter++;
                if (excludeSet.has(globalCounter)) {
                    log(`除外: ${file.name}（${globalCounter}ページ目）`, 'warn');
                } else {
                    const img = file.type === 'image/jpeg'
                        ? await newDoc.embedJpg(bytes) : await newDoc.embedPng(bytes);
                    const p = newDoc.addPage([a4w, a4h]);
                    const d = img.scaleToFit(a4w, a4h);
                    p.drawImage(img, { x: (a4w-d.width)/2, y: (a4h-d.height)/2, width: d.width, height: d.height });
                    log(`追加: ${file.name} (画像)`, 'ok');
                }
            }
            setProgress(Math.round(((fi + 1) / sorted.length) * 90));
        }
        return await newDoc.save({ useObjectStreams: false });
    }

    function addBlankPageWithContent(doc, w, h) {
    const p = doc.addPage([w, h]);
    p.drawRectangle({
        x: 0,
        y: 0,
        width: 1,
        height: 1,
        opacity: 0
    });
    }
